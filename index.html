<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrapper"></div>
  <div class="card">
    <!-- LEFT -->
    <div class="left">
      <div class="left-bg"></div>
      <div class="left-content">
        <h1>Bienvenido</h1>
        <p>Ingresa tus credenciales para continuar.</p>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" placeholder=" " autocomplete="username">
        <span class="field-error" id="error-usuario"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="input-wrapper">
          <input id="password" type="password" placeholder=" " autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
            👁️
          </button>
        </div>

        <span class="field-error" id="error-password"></span>
      </div>

      <div class="alert" id="alert-global"></div>

      <button class="btn" id="btn-login">
        <span class="btn-text">Iniciar sesión</span>
        <span class="btn-spinner" id="btn-spinner" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path
              d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
          </svg>
        </span>
      </button>


    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>

</html>
