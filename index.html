<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper"></div>
  <div class="card">
    <!-- LEFT -->
    <div class="left">
      <div class="left-bg"></div>
      <div class="left-content">
        <h1>Bienvenido</h1>
        <p>Ingresa tus credenciales para continuar.</p>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" placeholder=" " autocomplete="username">
        <span class="field-error" id="error-usuario"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <span class="field-error" id="error-password"></span>
      </div>

      <div class="alert" id="alert-global"></div>

      <button class="btn" id="btn-login" onclick="handleLogin()">
        <span class="btn-text">Iniciar sesión</span>
        <span class="btn-spinner" id="btn-spinner" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </span>
      </button>

      <p class="signin-link">¿No tienes una cuenta? <a href="#">Regístrate</a></p>
    </div>
  </div>

  <script>
    // ─── Helpers ────────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);

    function setLoading(active) {
      const btn = $('btn-login');
      btn.disabled = active;
      $('btn-spinner').style.display = active ? 'inline-flex' : 'none';
      btn.querySelector('.btn-text').textContent = active ? 'Verificando...' : 'Iniciar sesión';
    }

    function clearErrors() {
      ['usuario', 'password'].forEach(k => {
        $(`error-${k}`).textContent = '';
        $(`${k}`).classList.remove('input-error');
      });
      const alert = $('alert-global');
      alert.textContent = '';
      alert.className = 'alert';
    }

    function showFieldError(field, msg) {
      $(`error-${field}`).textContent = msg;
      $(field).classList.add('input-error');
    }

    function showGlobalAlert(msg, type = 'error') {
      const alert = $('alert-global');
      alert.textContent = msg;
      alert.className = `alert alert-${type}`;
    }

    // ─── Validación cliente ──────────────────────────────────────────────────────
    function validate() {
      let ok = true;
      const usuario  = $('usuario').value.trim();
      const password = $('password').value;

      if (!usuario) {
        showFieldError('usuario', 'El usuario es requerido.');
        ok = false;
      }
      if (!password) {
        showFieldError('password', 'La contraseña es requerida.');
        ok = false;
      } else if (password.length < 6) {
        showFieldError('password', 'Mínimo 6 caracteres.');
        ok = false;
      }
      return ok;
    }

    // ─── Lógica principal ────────────────────────────────────────────────────────
    async function handleLogin() {
      clearErrors();
      if (!validate()) return;

      setLoading(true);

      const payload = new FormData();
      payload.append('usuario',  $('usuario').value.trim());
      payload.append('password', $('password').value);

      try {
        const res  = await fetch('auth.php', { method: 'POST', body: payload });
        const data = await res.json();

        if (data.success) {
          showGlobalAlert('✓ Acceso concedido. Redirigiendo...', 'success');
          setTimeout(() => { window.location.href = data.redirect ?? 'dashboard.html'; }, 900);
        } else {
          showGlobalAlert(data.message ?? 'Credenciales incorrectas.');
          setLoading(false);
        }
      } catch (err) {
        showGlobalAlert('Error de conexión. Intenta de nuevo.');
        setLoading(false);
      }
    }

    // Enter key support
    ['usuario', 'password'].forEach(id => {
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    });
  </script>
</body>
</html>
