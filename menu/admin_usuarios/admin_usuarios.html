<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Usuarios</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin_usuarios.css">
</head>
<body>

  <div class="admin-container">

    <!-- Header -->
    <header class="admin-header">
      <a href="../menu.html" class="back-link" id="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Menú
      </a>
      <h1>Administración de Usuarios</h1>
    </header>

    <div class="admin-content">

      <!-- Crear usuario -->
      <div class="card card-form">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Crear nuevo usuario
        </h2>

        <form id="form-crear" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label for="inp-nombre">Nombre</label>
              <input type="text" id="inp-nombre" placeholder="Ej: Juan" required autocomplete="off">
            </div>
            <div class="form-group">
              <label for="inp-apellido">Apellido</label>
              <input type="text" id="inp-apellido" placeholder="Ej: Pérez" required autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="inp-email">Email</label>
            <input type="email" id="inp-email" placeholder="usuario@ejemplo.com" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="inp-password">Contraseña</label>
            <input type="password" id="inp-password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="sel-rol">Rol</label>
            <select id="sel-rol" required>
              <option value="" disabled selected>Cargando roles…</option>
            </select>
          </div>

          <button type="submit" class="btn-primary" id="btn-crear">
            <span class="btn-text">Crear usuario</span>
            <span class="btn-spinner" id="spinner-crear" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
          </button>
        </form>

        <div id="msg-crear" class="msg"></div>
      </div>

      <!-- Tabla de usuarios -->
      <div class="card card-table">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Usuarios registrados
        </h2>

        <div id="tabla-wrap">
          <table id="tabla-usuarios">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-users">
              <tr><td colspan="6" class="loading-cell">Cargando usuarios…</td></tr>
            </tbody>
          </table>
        </div>

        <div id="msg-tabla" class="msg"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth-guard.js"></script>
  <script src="admin_usuarios.js"></script>

</body>
</html>
