<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de luminarias</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="stylesrl.css?v=2">
</head>
<body>
  <div id="map"></div>

  <!-- Panel de estadísticas -->
  <div id="panel-stats">
    <div class="panel-header">
      <span class="panel-title">Estado de Luminarias</span>
      <button class="panel-toggle" onclick="togglePanel()" title="Minimizar">−</button>
    </div>

    <div id="panel-body">
      <div class="stat-total-wrap">
        <span id="stat-total" class="stat-total-num">—</span>
        <span class="stat-total-label">total registradas</span>
      </div>

      <div id="geojson-info"
        style="font-size:12px; color:#666; margin-bottom:12px; display:none; padding-bottom:10px; border-bottom:1px solid #f0f0f0;">
        Archivo cargado:<br>
        <span id="geojson-name" style="font-weight:600; color:#2563eb;"></span>
      </div>

      <div id="stat-tipos"></div>

      <div id="stat-barra-wrap">
        <div id="stat-barra"></div>
      </div>

      <button id="btn-add" onclick="activarModoAñadir()">➕ Añadir Luminaria</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth-guard.js"></script>
  <script src="apprl.js"></script>
</body>
</html>
